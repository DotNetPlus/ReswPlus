name: Build, Test, and (Optionally) Publish ReswPlus

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # Runs only when a tag like v1.0.0 is pushed
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger via GitHub Actions UI

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: nuget/setup-nuget@v4

      - name: Determine Build Configuration
        id: config
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            echo "BUILD_CONFIG=Debug" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            echo "BUILD_CONFIG=Release" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Restore Nuget
        run: nuget restore ReswPlus.sln
        working-directory: ${{ github.workspace }}

      - name: DotNet Restore
        run: dotnet restore ReswPlus.sln
        working-directory: ${{ github.workspace }}
        
      - name: Build Solution
        run: msbuild ReswPlus.sln /p:Configuration=${{ env.BUILD_CONFIG }} /p:Platform=x64 /p:PublishReadyToRun=false
        working-directory: ${{ github.workspace }}

      - name: Run Unit Tests
        run: dotnet test tests/ReswPlusUnitTests/ReswPlusUnitTests.csproj --configuration ${{ env.BUILD_CONFIG }} --no-build --verbosity normal
        working-directory: ${{ github.workspace }}

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = dotnet msbuild src/ReswPlus.SourceGenerator/ReswPlus.SourceGenerator.csproj -getProperty:Version -property:Configuration=Release -nologo
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($packageVersion.Trim() -ne $tagVersion) {
            throw "Tag version '$tagVersion' does not match package version '$packageVersion'."
          }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit on main."
          }

      - name: Pack NuGet package
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet pack src/ReswPlus.SourceGenerator/ReswPlus.SourceGenerator.csproj --configuration Release --no-restore --output nupkg /p:ContinuousIntegrationBuild=true
        working-directory: ${{ github.workspace }}

      - name: Upload NuGet package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: ReswPlus-${{ github.ref_name }}
          path: nupkg/*.nupkg
          if-no-files-found: error

      - name: Push NuGet package
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem -Path nupkg -Filter *.nupkg)
          if ($packages.Count -ne 1) {
            throw "Expected exactly one NuGet package, found $($packages.Count)."
          }
          dotnet nuget push $packages[0].FullName --api-key $env:NUGET_API_KEY --source "https://api.nuget.org/v3/index.json" --skip-duplicate
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
        working-directory: ${{ github.workspace }}
